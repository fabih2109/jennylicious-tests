<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jennylicious – iPhone Kacheltest A–D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--purple:#7b36a8;--bg1:#f3e4f4;--bg2:#fffaf6;--ink:#241a29}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eee;color:var(--ink)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:520px;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2) 48%,#f7eef8);padding:18px 16px 60px;overflow:hidden}
.header{margin-bottom:14px}
.header h1{font:800 30px/1.05 Georgia,serif;margin:0 0 5px}
.header p{margin:0;color:#716776;font-size:13px;line-height:1.4}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 12px}
.controls button{border:0;border-radius:14px;padding:11px 8px;background:white;color:#5b247e;font-weight:800;font-size:13px;box-shadow:0 2px 8px #5b247e10}
.controls button.active{background:var(--purple);color:white}
.metrics{background:#fff;border-radius:14px;padding:10px 12px;margin:0 0 16px;font-size:12px;line-height:1.45;box-shadow:0 2px 10px #5b247e10}
.metrics b{color:#5b247e}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.card{position:relative;min-width:0;aspect-ratio:1/1.04;overflow:hidden;border-radius:17px;background:#cba9d8;box-shadow:0 4px 14px #43264a18}
.card::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 18% 18%,#6ba84a 0 9%,transparent 10%),
  radial-gradient(circle at 77% 22%,#f0c05a 0 13%,transparent 14%),
  linear-gradient(145deg,#80af63 0 31%,#e2ad70 32% 58%,#8b5d43 59% 100%)}
.card:nth-child(2)::before{background:
  radial-gradient(circle at 23% 20%,#7cb25b 0 10%,transparent 11%),
  radial-gradient(circle at 70% 25%,#f6d076 0 12%,transparent 13%),
  linear-gradient(145deg,#79a85e 0 26%,#d89b68 27% 57%,#70442e 58% 100%)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 34%,rgba(14,8,17,.12) 55%,rgba(15,8,18,.84) 100%)}
.heart{position:absolute;z-index:2;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fffef4e8;display:grid;place-items:center;color:#a94785;font-size:22px}
.caption{position:absolute;z-index:2;left:10px;right:10px;bottom:10px;color:#fff;text-shadow:0 1px 4px #0009}
.caption strong{display:block;font-size:13px;line-height:1.18;font-weight:850;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:normal;word-break:normal}
.caption small{display:block;margin-top:5px;font-size:11px;color:#fff}
.badge{position:absolute;z-index:3;left:7px;top:7px;padding:3px 6px;border-radius:7px;background:#111b;color:#fff;font-size:9px;font-weight:700}

/* A – aktueller Ansatz: Elterncontainer + 20 px */
.mode-a .grid{width:calc(100% + 20px);margin-left:-10px;gap:8px}

/* B – echter Breakout auf die komplette Viewportbreite */
.mode-b .grid{width:100vw;margin-left:calc(50% - 50vw);gap:8px;padding:0}

/* C – Viewportbreite mit bewusstem Außenrand */
.mode-c .grid{width:calc(100vw - 20px);margin-left:calc(50% - 50vw + 10px);gap:8px;padding:0}

/* D – Flexbox statt Grid, Karten explizit aus Viewportbreite */
.mode-d .grid{display:flex;width:100vw;margin-left:calc(50% - 50vw);gap:8px;padding:0 8px}
.mode-d .card{flex:0 0 calc((100vw - 24px)/2)}

.explain{margin-top:18px;background:#fff;border-radius:14px;padding:11px 12px;font-size:12px;line-height:1.45;color:#6e6472;box-shadow:0 2px 10px #5b247e10}
.explain strong{color:#4f1f70}
@media (max-width:360px){.app{padding-left:12px;padding-right:12px}.caption strong{font-size:12px}}
</style>
</head>
<body>
<main class="app mode-a" id="app">
  <section class="header">
    <h1>Kacheltest iPhone</h1>
    <p>Nur Layout. Keine Datenbank, kein Service Worker, kein GitHub.</p>
  </section>

  <div class="controls">
    <button class="active" data-mode="a">A · Aktuell</button>
    <button data-mode="b">B · 100vw</button>
    <button data-mode="c">C · 100vw − Rand</button>
    <button data-mode="d">D · Flexbox</button>
  </div>

  <div class="metrics" id="metrics">Messwerte werden geladen …</div>

  <section class="grid" id="grid">
    <article class="card">
      <span class="badge"></span><span class="heart">♡</span>
      <div class="caption"><strong>Familiennudelauflauf mit Kochschinken</strong><small>30 Min</small></div>
    </article>
    <article class="card">
      <span class="badge"></span><span class="heart">♡</span>
      <div class="caption"><strong>Nudel-Champignon-Auflauf</strong><small>30 Min</small></div>
    </article>
  </section>

  <div class="explain" id="desc">
    <strong>A · Aktuell:</strong> Das Grid wird nur relativ zum vorhandenen Elterncontainer verbreitert.
  </div>
</main>
<script>
const app=document.getElementById('app');
const grid=document.getElementById('grid');
const metrics=document.getElementById('metrics');
const desc=document.getElementById('desc');
const descriptions={
 a:'<strong>A · Aktuell:</strong> Das Grid wird nur relativ zum vorhandenen Elterncontainer verbreitert.',
 b:'<strong>B · 100vw:</strong> Das Grid ignoriert den Elterncontainer und nutzt die komplette Viewportbreite.',
 c:'<strong>C · 100vw − Rand:</strong> Wie B, aber mit bewusstem Außenrand von 10 px links und rechts.',
 d:'<strong>D · Flexbox:</strong> CSS Grid wird umgangen; jede Karte erhält explizit ungefähr die halbe Viewportbreite.'
};
function measure(){
 const cards=[...document.querySelectorAll('.card')];
 const vw=window.innerWidth;
 const appW=app.getBoundingClientRect().width;
 const gridW=grid.getBoundingClientRect().width;
 const cardW=cards[0].getBoundingClientRect().width;
 cards.forEach(c=>c.querySelector('.badge').textContent=Math.round(c.getBoundingClientRect().width)+' px');
 metrics.innerHTML='Viewport: <b>'+Math.round(vw)+' px</b> &nbsp;·&nbsp; App: <b>'+Math.round(appW)+' px</b><br>Grid: <b>'+Math.round(gridW)+' px</b> &nbsp;·&nbsp; Kachel: <b>'+Math.round(cardW)+' px</b>';
}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 const mode=btn.dataset.mode;
 app.className='app mode-'+mode;
 desc.innerHTML=descriptions[mode];
 requestAnimationFrame(()=>requestAnimationFrame(measure));
}));
window.addEventListener('resize',measure);
window.addEventListener('orientationchange',()=>setTimeout(measure,100));
requestAnimationFrame(()=>requestAnimationFrame(measure));
</script>
</body>
</html>
